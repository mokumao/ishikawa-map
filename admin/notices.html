<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="admin-notice-api" content="https://ishikawa-map-admin-notices.shinzatoisao1969.workers.dev">
  <title>管理者からのお知らせ管理｜石川マップ</title>
  <style>
    :root {
      --blue: #0867b2;
      --blue-dark: #074f89;
      --green: #16865c;
      --red: #c62828;
      --ink: #183042;
      --muted: #607d8b;
      --line: #d9e2e8;
      --surface: #fff;
      --canvas: #eef3f6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    button, input, select, textarea { font: inherit; }
    .page { width: min(1120px, 100%); margin: 0 auto; padding: 24px; }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    h1, h2 { margin: 0; line-height: 1.35; }
    h1 { font-size: 24px; }
    h2 { font-size: 20px; }
    #editorTitle { color: var(--red); }
    .editor-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .editor-status {
      border-radius: 999px;
      background: var(--blue);
      color: #fff;
      padding: 2px 8px;
      font-size: 14px;
      font-weight: 700;
    }
    .editor-status[hidden] { display: none; }
    .back-link { color: var(--blue); font-weight: 700; text-decoration: none; }
    .intro { margin: 8px 0 24px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, .9fr); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
    .field { display: grid; gap: 4px; }
    .field.wide { grid-column: 1 / -1; }
    label { font-weight: 700; font-size: 14px; }
    input, select, textarea {
      width: 100%;
      min-height: 48px;
      border: 1px solid #aebdc7;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
    }
    textarea { min-height: 152px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 3px solid rgba(8, 103, 178, .2); border-color: var(--blue); }
    .actions { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; margin-top: 16px; }
    .button {
      min-height: 48px;
      border: 1px solid var(--blue);
      border-radius: 8px;
      background: #fff;
      color: var(--blue);
      padding: 10px 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .button.primary { background: var(--blue); color: #fff; }
    .button.danger { border-color: var(--red); color: var(--red); }
    .button.danger-confirm { border-color: var(--red); background: var(--red); color: #fff; }
    .publish-buttons { display: flex; max-width: 100%; flex-direction: column; gap: 8px; }
    .actions .publish-buttons .button { flex: 0 0 auto; }
    .publish-buttons .button[hidden] { display: none; }
    .new-entry-row { display: flex; flex: 1 1 100%; justify-content: flex-end; }
    .actions .new-entry-button {
      flex: 0 0 auto;
      border-color: var(--green);
      background: var(--green);
      color: #fff;
    }
    .button:disabled { cursor: wait; opacity: .55; }
    .hide-confirm {
      display: flex;
      flex: 1 1 100%;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid #ef9a9a;
      border-radius: 8px;
      background: #fff5f5;
    }
    .hide-confirm[hidden] { display: none; }
    .hide-confirm-text { flex: 1 1 220px; margin: 0; font-weight: 700; }
    .status { min-height: 24px; margin: 12px 0 0; font-size: 14px; font-weight: 700; }
    .status.error { color: var(--red); }
    .status.success { color: var(--green); }
    .list-head { display: flex; align-items: center; justify-content: flex-start; gap: 8px; }
    .list-summary { margin: 0; color: var(--red); font-size: 14px; font-weight: 700; text-align: left; }
    .list-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .list-actions .button[hidden] { display: none; }
    .notice-list {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      max-height: calc(100vh - 180px);
      max-height: calc(100dvh - 180px);
      margin-top: 16px;
      padding-right: 4px;
      overflow-y: auto;
      overscroll-behavior-y: contain;
      scrollbar-gutter: stable;
    }
    .notice {
      min-width: 0;
      border: 1px solid var(--line);
      border-left: 5px solid #90a4ae;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
    }
    .notice[data-status="published"] { border-left-color: #43a047; }
    .notice[data-status="scheduled"] { border-left-color: #1976d2; }
    .notice[data-status="draft"] { border-left-color: #fb8c00; }
    .notice:hover { background: #f7fafc; }
    .notice-title { margin: 4px 0; overflow-wrap: anywhere; font-size: 16px; font-weight: 800; }
    .notice-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; }
    .notice-meta { min-width: 0; flex: 1 1 180px; margin: 0; color: var(--blue-dark); font-size: 16px; }
    .notice-delete-area { display: flex; flex: 0 0 auto; justify-content: flex-end; }
    .notice-delete-area.is-confirming { flex: 1 1 100%; }
    .notice-delete-button { min-height: 36px; border-color: var(--red); color: var(--red); padding: 4px 12px; }
    .notice-delete-confirm {
      display: flex;
      width: 100%;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px;
      border: 1px solid #ef9a9a;
      border-radius: 8px;
      background: #fff5f5;
    }
    .notice-delete-confirm p { flex: 1 1 180px; margin: 0; font-size: 14px; font-weight: 700; }
    .notice-delete-confirm .button { min-height: 40px; padding: 6px 16px; }
    .badge { display: inline-block; border-radius: 999px; background: #edf2f5; padding: 2px 8px; font-size: 12px; font-weight: 700; }
    .empty { padding: 24px 8px; color: var(--muted); text-align: center; }
    @media (max-width: 760px) {
      .page { padding: 16px 12px calc(24px + env(safe-area-inset-bottom)); }
      .page-header { align-items: flex-start; }
      h1 { font-size: 20px; }
      .layout { grid-template-columns: 1fr; }
      .card { border-radius: 12px; padding: 16px; }
      .form-grid { grid-template-columns: 1fr; gap: 12px; }
      .field.wide { grid-column: auto; }
      .actions .button { flex: 1 1 136px; }
      .list-head { align-items: center; }
      .list-summary { flex: 1 1 auto; }
      .list-actions { justify-content: stretch; }
      .list-actions .button { flex: 1 1 140px; }
      .notice-list {
        max-height: none;
        padding-right: 0;
        overflow-y: visible;
        overscroll-behavior-y: auto;
        scrollbar-gutter: auto;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <h1>管理者からのお知らせ管理</h1>
      <a class="back-link" href="https://ishikawa-map-admin.pages.dev/">← 管理者ページへ</a>
    </div>
    <p class="intro">投稿は選択した地域だけに表示されます。非公開にしても履歴は残ります。</p>

    <div class="layout">
      <section class="card" aria-labelledby="editorTitle">
        <div class="editor-head">
          <h2 id="editorTitle">新規入力</h2>
          <span class="editor-status" id="editorStatus" hidden></span>
        </div>
        <form id="noticeForm">
          <input type="hidden" id="noticeId">
          <input type="hidden" id="revision">
          <div class="form-grid">
            <div class="field">
              <label for="regionId">地域</label>
              <select id="regionId" required><option value="ishikawa">うるま市石川地区</option></select>
            </div>
            <div class="field">
              <label for="category">分類</label>
              <input id="category" maxlength="40" placeholder="例：地域行事">
            </div>
            <div class="field wide">
              <label for="title">タイトル（必須）</label>
              <input id="title" maxlength="120" required>
            </div>
            <div class="field wide">
              <label for="body">詳しい内容</label>
              <textarea id="body" maxlength="2000"></textarea>
            </div>
            <div class="field">
              <label for="startsAt">掲載開始</label>
              <input id="startsAt" type="datetime-local">
            </div>
            <div class="field">
              <label for="endsAt">掲載終了</label>
              <input id="endsAt" type="datetime-local">
            </div>
          </div>
          <div class="actions">
            <button class="button" type="button" data-save="draft">下書き保存</button>
            <div class="publish-buttons">
              <button class="button primary" type="button" data-save="published">公開する</button>
              <button class="button primary" id="publishAsNewButton" type="button" hidden>修正して公開する（新規で）</button>
            </div>
            <button class="button danger" id="hideButton" type="button" hidden>非公開にする</button>
            <div class="new-entry-row">
              <button class="button new-entry-button" id="resetButton" type="button">新規入力</button>
            </div>
            <div class="hide-confirm" id="hideConfirm" role="group" aria-labelledby="hideConfirmText" hidden>
              <p class="hide-confirm-text" id="hideConfirmText">本当に非公開にしますか？</p>
              <button class="button danger-confirm" id="confirmHideButton" type="button">非公開にする</button>
              <button class="button" id="cancelHideButton" type="button">キャンセル</button>
            </div>
          </div>
          <p class="status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="card" aria-labelledby="listTitle">
        <div class="list-head">
          <h2 id="listTitle">お知らせ一覧</h2>
          <p class="list-summary" id="listSummary">（公開中・公開予定・下書き）</p>
        </div>
        <div class="list-actions">
          <button class="button" id="togglePastButton" type="button" aria-expanded="false" hidden>過去の投稿を見る</button>
          <button class="button" id="reloadButton" type="button">再読み込み</button>
        </div>
        <div class="notice-list" id="noticeList"><p class="empty">読み込み中です…</p></div>
      </section>
    </div>
  </main>

  <script>
    if (location.hostname === 'ishikawa-map-admin.pages.dev') {
      location.replace('https://ishikawa-map-admin-notices.shinzatoisao1969.workers.dev/');
    }
  </script>
  <script>
    (function () {
      'use strict';
      var configured = document.querySelector('meta[name="admin-notice-api"]').content.trim();
      var apiBase = configured || location.origin;
      var form = document.getElementById('noticeForm');
      var status = document.getElementById('formStatus');
      var list = document.getElementById('noticeList');
      var hideButton = document.getElementById('hideButton');
      var publishButton = form.querySelector('[data-save="published"]');
      var publishAsNewButton = document.getElementById('publishAsNewButton');
      var hideConfirm = document.getElementById('hideConfirm');
      var confirmHideButton = document.getElementById('confirmHideButton');
      var togglePastButton = document.getElementById('togglePastButton');
      var listSummary = document.getElementById('listSummary');
      var editorTitle = document.getElementById('editorTitle');
      var editorStatus = document.getElementById('editorStatus');
      var notices = [];
      var showPast = false;

      function request(path, options) {
        var config = Object.assign({ credentials: 'include' }, options || {});
        config.headers = Object.assign({ 'content-type': 'application/json' }, config.headers || {});
        return fetch(apiBase + path, config).then(function (response) {
          return response.json().catch(function () { return {}; }).then(function (data) {
            if (!response.ok) throw new Error(data.message || '通信に失敗しました。');
            return data;
          });
        });
      }

      function value(id) { return document.getElementById(id).value; }
      function iso(id) { var v = value(id); return v ? new Date(v).toISOString() : null; }
      function localDate(value) {
        if (!value) return '';
        var date = new Date(value);
        var local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
        return local.toISOString().slice(0, 16);
      }
      function formatJst(value) {
        if (!value) return '';
        var date = new Date(value);
        if (Number.isNaN(date.getTime())) return '';
        var parts = new Intl.DateTimeFormat('ja-JP', {
          timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit',
          hour: '2-digit', minute: '2-digit', hourCycle: 'h23'
        }).formatToParts(date).reduce(function (result, part) {
          result[part.type] = part.value;
          return result;
        }, {});
        return parts.year + '-' + parts.month + '-' + parts.day + ' ' + parts.hour + ':' + parts.minute;
      }
      function displayStatus(item, now) {
        if (item.status !== 'published') return item.status;
        var current = now || new Date();
        if (item.startsAt && new Date(item.startsAt) > current) return 'scheduled';
        if (item.endsAt && new Date(item.endsAt) < current) return 'expired';
        return 'published';
      }
      function isPastNotice(item) {
        var itemStatus = displayStatus(item);
        return itemStatus === 'expired' || itemStatus === 'hidden';
      }
      function showEditorState(item) {
        var itemStatus = displayStatus(item);
        var labels = { published: '公開中', scheduled: '公開中', draft: '下書き', hidden: '非公開', expired: '掲載期間終了' };
        editorTitle.textContent = '既存のお知らせを編集';
        editorStatus.textContent = labels[itemStatus] || itemStatus;
        editorStatus.hidden = false;
        publishButton.textContent = '修正して公開する（上書き）';
        publishAsNewButton.hidden = false;
      }
      function showNewEditorState() {
        editorTitle.textContent = '新規入力';
        editorStatus.textContent = '';
        editorStatus.hidden = true;
        publishButton.textContent = '公開する';
        publishAsNewButton.hidden = true;
      }
      function payload(saveStatus) {
        return {
          regionId: value('regionId'), title: value('title'), body: value('body'),
          category: value('category'), status: saveStatus,
          startsAt: iso('startsAt'), endsAt: iso('endsAt'),
          revision: Number(value('revision')) || undefined
        };
      }
      function setStatus(message, type) { status.textContent = message; status.className = 'status ' + (type || ''); }
      function setBusy(busy) { form.querySelectorAll('button').forEach(function (button) { button.disabled = busy; }); }
      function closeHideConfirm(restoreFocus) {
        hideConfirm.hidden = true;
        var item = notices.find(function (notice) { return notice.id === value('noticeId'); });
        hideButton.hidden = !item || item.status === 'hidden';
        if (restoreFocus && !hideButton.hidden) hideButton.focus();
      }

      function save(saveStatus, createNew) {
        if (!form.reportValidity()) return;
        closeHideConfirm(false);
        var id = createNew ? '' : value('noticeId');
        var requestBody = payload(saveStatus);
        if (createNew) delete requestBody.revision;
        setBusy(true); setStatus('保存しています…');
        request('/api/v1/admin/notices' + (id ? '/' + encodeURIComponent(id) : ''), {
          method: id ? 'PUT' : 'POST', body: JSON.stringify(requestBody)
        }).then(function (data) {
          document.getElementById('noticeId').value = data.id;
          document.getElementById('revision').value = data.revision || '';
          document.getElementById('hideButton').hidden = false;
          showEditorState({ status: saveStatus, startsAt: iso('startsAt'), endsAt: iso('endsAt') });
          setStatus(data.message, 'success');
          return loadNotices();
        }).catch(function (error) { setStatus(error.message, 'error'); }).finally(function () { setBusy(false); });
      }

      function resetForm() {
        hideConfirm.hidden = true;
        form.reset();
        document.getElementById('noticeId').value = '';
        document.getElementById('revision').value = '';
        document.getElementById('hideButton').hidden = true;
        showNewEditorState();
        setStatus('');
      }

      function editNotice(id) {
        closeHideConfirm(false);
        var item = notices.find(function (notice) { return notice.id === id; });
        if (!item) return;
        document.getElementById('noticeId').value = item.id;
        ['revision', 'regionId', 'title', 'body', 'category'].forEach(function (key) {
          document.getElementById(key).value = item[key] == null ? '' : item[key];
        });
        document.getElementById('startsAt').value = localDate(item.startsAt);
        document.getElementById('endsAt').value = localDate(item.endsAt);
        document.getElementById('hideButton').hidden = item.status === 'hidden';
        showEditorState(item);
        setStatus('');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function renderNotices() {
        var pastCount = notices.filter(isPastNotice).length;
        var visibleNotices = notices.filter(function (item) { return showPast || !isPastNotice(item); });
        togglePastButton.hidden = pastCount === 0;
        togglePastButton.setAttribute('aria-expanded', String(showPast));
        togglePastButton.textContent = showPast ? '過去の投稿を隠す' : '過去の投稿を見る（' + pastCount + '件）';
        listSummary.textContent = showPast
          ? '（公開中・公開予定・下書き・掲載期間終了・非公開）'
          : '（公開中・公開予定・下書き）';
        list.replaceChildren();
        if (!visibleNotices.length) {
          list.innerHTML = '<p class="empty">現在・今後の投稿はありません。</p>';
          return;
        }
        visibleNotices.forEach(function (item) {
            var visibleStatus = displayStatus(item);
            var article = document.createElement('article');
            article.className = 'notice'; article.dataset.status = visibleStatus; article.tabIndex = 0;
            var labels = { published: '公開中', scheduled: '公開予定', expired: '掲載期間終了', draft: '下書き', hidden: '非公開' };
            var badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = labels[visibleStatus] || visibleStatus;
            var title = document.createElement('p'); title.className = 'notice-title'; title.textContent = item.title;
            var meta = document.createElement('p'); meta.className = 'notice-meta';
            meta.textContent = (item.category || '分類なし') + '／更新 ' + formatJst(item.updatedAt);
            var footer = document.createElement('div'); footer.className = 'notice-footer';
            var deleteArea = document.createElement('div'); deleteArea.className = 'notice-delete-area';
            var deleteButton = document.createElement('button'); deleteButton.type = 'button';
            deleteButton.className = 'button notice-delete-button'; deleteButton.textContent = '削除';
            deleteButton.addEventListener('click', function (event) {
              event.preventDefault();
              event.stopPropagation();
              showDeleteConfirm(item, deleteArea, deleteButton);
            });
            deleteArea.appendChild(deleteButton);
            footer.append(meta, deleteArea);
            article.append(badge, title, footer);
            article.addEventListener('click', function () { editNotice(item.id); });
            article.addEventListener('keydown', function (event) {
              if (event.target === article && event.key === 'Enter') editNotice(item.id);
            });
            list.appendChild(article);
        });
      }

      function showDeleteConfirm(item, deleteArea, deleteButton) {
        var confirm = document.createElement('div'); confirm.className = 'notice-delete-confirm';
        var message = document.createElement('p'); message.textContent = '投稿を削除しますか？';
        var okButton = document.createElement('button'); okButton.type = 'button';
        okButton.className = 'button danger-confirm'; okButton.textContent = 'OK';
        var cancelButton = document.createElement('button'); cancelButton.type = 'button';
        cancelButton.className = 'button'; cancelButton.textContent = 'キャンセル';
        confirm.append(message, okButton, cancelButton);
        deleteArea.classList.add('is-confirming');
        deleteArea.replaceChildren(confirm);
        okButton.focus();
        cancelButton.addEventListener('click', function (event) {
          event.preventDefault(); event.stopPropagation();
          deleteArea.classList.remove('is-confirming');
          deleteArea.replaceChildren(deleteButton); deleteButton.focus();
        });
        okButton.addEventListener('click', function (event) {
          event.preventDefault(); event.stopPropagation();
          okButton.disabled = true; cancelButton.disabled = true;
          request('/api/v1/admin/notices/' + encodeURIComponent(item.id) + '/delete', { method: 'POST' })
            .then(function (data) {
              if (value('noticeId') === item.id) resetForm();
              setStatus(data.message, 'success');
              return loadNotices();
            })
            .catch(function (error) {
              okButton.disabled = false; cancelButton.disabled = false;
              setStatus(error.message, 'error');
            });
        });
      }

      function loadNotices() {
        list.innerHTML = '<p class="empty">読み込み中です…</p>';
        togglePastButton.disabled = true;
        return request('/api/v1/admin/notices?region=ishikawa').then(function (data) {
          notices = data.items || [];
          renderNotices();
        }).catch(function (error) {
          list.innerHTML = '<p class="empty">' + error.message + '</p>';
        }).finally(function () {
          togglePastButton.disabled = false;
        });
      }

      document.querySelectorAll('[data-save]').forEach(function (button) {
        button.addEventListener('click', function () { save(button.dataset.save); });
      });
      publishAsNewButton.addEventListener('click', function () { save('published', true); });
      document.getElementById('resetButton').addEventListener('click', resetForm);
      document.getElementById('reloadButton').addEventListener('click', loadNotices);
      togglePastButton.addEventListener('click', function () {
        showPast = !showPast;
        renderNotices();
      });
      hideButton.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopPropagation();
        if (!value('noticeId')) return;
        hideButton.hidden = true;
        hideConfirm.hidden = false;
        confirmHideButton.focus();
      });
      document.getElementById('cancelHideButton').addEventListener('click', function () {
        closeHideConfirm(true);
      });
      confirmHideButton.addEventListener('click', function () {
        var id = value('noticeId'); if (!id) return;
        closeHideConfirm(false);
        setBusy(true);
        setStatus('非公開にしています…');
        request('/api/v1/admin/notices/' + encodeURIComponent(id), { method: 'DELETE' })
          .then(function (data) { resetForm(); setStatus(data.message, 'success'); return loadNotices(); })
          .catch(function (error) { closeHideConfirm(false); setStatus(error.message, 'error'); })
          .finally(function () { setBusy(false); });
      });
      loadNotices();
    })();
  </script>
</body>
</html>
