  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* body自体はスクロールさせず、中の.page-scrollだけを内部スクロールさせる
       構造にする（index.htmlと同じ方式）。position:fixedの下部バーを
       モバイルでスクロールに追従して動かなくするための根本対策

    html { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", sans-serif;

    /* ── ヘッダー ── */

    }
    .back-btn:hover { background: rgba(255,255,255,.28); }
    .header-title {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── メインカード ── */
    .detail-card {
      max-width: 640px;

    .shop-hero {

    .shop-name {

    .shop-genre-badge {

    .warn-badge {

    }
    .warn-reason {
      display: block;

    }

    /* ── セクション共通 ── */
    .section {
      background: #fff;
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);

    }
    .section-title {

    }

    /* ── 基本情報テーブル ── */
    .info-table { width: 100%; border-collapse: collapse; }
    .info-table tr { border-bottom: 1px solid #f5f5f5; }
    .info-table tr:last-child { border-bottom: none; }
    .info-table td { padding: 9px 0; vertical-align: top; font-size: 0.9rem; line-height: 1.55; }
    .info-table .lbl {
      color: #888; font-size: 0.78rem; font-weight: 700;

    }
    .warn-text { color: #e65100; }
    .source-note { font-size: 0.72rem; color: #1565c0; font-weight: 400; margin-left: 4px; }
    .source-note a { color: inherit; text-decoration: underline; }

    /* ── 警告ボックス ── */

    /* ── SNSリンクボタン ── */

    /* ── 紹介文 ── */

    /* ── 未入力プレースホルダー ── */

    /* ── 修正履歴 ── */

    }

    /* ── Googleマップボタン ── */
    .gmap-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px;
      background: #e8f5e9;
      color: #1b5e20;
      border: 1.5px solid #a5d6a7;
      border-radius: 10px;

      font-weight: 700;
      text-decoration: none;
      transition: background .15s;
    }
    .gmap-btn:hover { background: #c8e6c9; }

    /* ── 地図／一覧 切り替えボタン（画面下部） ──
       position:fixedをやめ、body（flex-column）の最後の子要素として
       常時配置する。中身は.page-scrollが内部スクロールするので、
       このバー自体はスクロールの影響を受けず、モバイルでもズレない */
    .view-toggle-bar {
      flex-shrink: 0;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      box-shadow: 0 -2px 8px rgba(0,0,0,.08);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
      /* メイン地図画面の下部バー（.bottom-tabs）が持つattribution分の
         余白と、下部の見た目の高さを揃える（.claude/skills/footer-map-button/SKILL.md参照） */

    .view-toggle {

    .view-toggle-btn {

    /* 隣のボタン数に関わらず常に113px固定（.claude/skills/footer-map-button/SKILL.md参照） */

<body>

  <div class="page-scroll">
    <main class="detail-card" id="detailCard">
      <div class="error-box"><p>読み込み中…</p></div>
    </main>

    <footer class="detail-footer">
      🌊 うるま市石川 飲食店マップ &nbsp;|&nbsp; 掲載情報は調査時点のものです
    </footer>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">✕</button>
    <img src="" alt="" id="lightboxImg">
  </div>

  <!-- 地図／一覧 切り替え（画面下部） -->
  <div class="view-toggle-bar">
    <div class="view-toggle">
      <a href="index.html?tab=map" class="view-toggle-btn" id="mapToggleBtn">地図</a>
      <a href="index.html?tab=list" class="view-toggle-btn" id="listToggleBtn">一覧</a>
    </div>

  <script src="restaurants-data.js?v=20260814a"></script>
  <script>
    (function () {
      // IDパラメータ取得（クエリ文字列 ?id=N 形式）
      // 旧URL（detail.html#N ハッシュ形式）でアクセスされた場合は、
      // 同じ番号をidとみなし、履歴を汚さない方法（replaceState）で
      // ?id=N 形式のURLに置き換えてから続行する。
      var params = new URLSearchParams(location.search);
      var idParam = params.get('id');
      if (idParam === null && location.hash) {
        var hashVal = location.hash.replace('#', '');
        if (hashVal !== '') {
          idParam = hashVal;
          var newUrl = location.pathname + '?id=' + encodeURIComponent(hashVal);
          history.replaceState(null, '', newUrl);
        }
      }

      // プレビュー環境判定（script.jsを読み込まないため同じロジックをここに複製）
      function isPreviewEnv() {
        var isLocal = ['localhost', '127.0.0.1', ''].indexOf(location.hostname) !== -1;
        var hasPreviewParam = new URLSearchParams(location.search).get('preview') === '1';
        return isLocal || hasPreviewParam;
      }

      const id = parseInt(idParam, 10);
      const found = restaurants.find(function (x) { return x.id === id; });
      // status が published 以外（test等）の店舗は、プレビュー環境以外では
      // 「見つからない」扱いにする（restaurants配列自体は変更しない）
      const isHidden = !!(found && found.status && found.status !== 'published' && !isPreviewEnv());
      const r = isHidden ? null : found;
      const card = document.getElementById('detailCard');

      // 「地図」ボタン：この店舗のピンを開いた状態の地図へ戻す
      var mapBtn = document.getElementById('mapToggleBtn');
      if (mapBtn && r) mapBtn.href = 'index.html?tab=map&shop=' + r.id;

      if (!r) {
        card.innerHTML = `<div class="error-box"><h2>店舗が見つかりません</h2><p><a href="index.html">地図に戻る</a></p></div>`;
        // 店舗が見つからない/非公開ページはGoogleにインデックスさせない
        var robotsMeta = document.createElement('meta');
        robotsMeta.setAttribute('name', 'robots');
        robotsMeta.setAttribute('content', 'noindex');
        document.head.appendChild(robotsMeta);
        return;
      }

      // タイトル更新
      const pageTitle = r.name + ' | うるま市石川 飲食店マップ';
      document.title = pageTitle;

      // meta description も店舗ごとの内容に更新
      const descText = r.name + '（' + r.genre + '）沖縄県うるま市石川エリアの店舗情報。住所：' + r.address;
      var metaDesc = document.querySelector('meta[name="description"]');
      if (metaDesc) metaDesc.setAttribute('content', descText);

      // canonical / OGP タグを店舗ごとの内容に更新
      const pageUrl = 'https://mokumao.github.io/ishikawa-map/detail.html?id=' + r.id;
      var canonicalLink = document.getElementById('canonicalLink');
      if (canonicalLink) canonicalLink.setAttribute('href', pageUrl);
      var ogTitle = document.getElementById('ogTitle');
      if (ogTitle) ogTitle.setAttribute('content', pageTitle);
      var ogDescription = document.getElementById('ogDescription');
      if (ogDescription) ogDescription.setAttribute('content', descText);
      var ogUrl = document.getElementById('ogUrl');
      if (ogUrl) ogUrl.setAttribute('content', pageUrl);

      // 構造化データ（JSON-LD）：ジャンルをおおまかにSchema.orgの型へ対応させる
      function genreToSchemaType(genre) {
        if (!genre) return 'LocalBusiness';
        if (genre.indexOf('コンビニ') !== -1) return 'ConvenienceStore';
        if (genre.indexOf('ガソリン') !== -1) return 'GasStation';
        if (genre.indexOf('宿泊') !== -1) return 'LodgingBusiness';
        if (genre.indexOf('金融') !== -1) return 'BankOrCreditUnion';
        if (genre.indexOf('教育') !== -1) return 'EducationalOrganization';
        if (genre.indexOf('観光') !== -1) return 'TouristAttraction';
        if (genre.indexOf('美容') !== -1 || genre.indexOf('理容') !== -1) return 'HairSalon';
        if (genre.indexOf('カフェ') !== -1) return 'CafeOrCoffeeShop';
        if (genre.indexOf('居酒屋') !== -1 || genre.indexOf('バル') !== -1 || genre.indexOf('バー') !== -1) return 'BarOrPub';
        if (genre.indexOf('食事処') !== -1 || genre.indexOf('ラーメン') !== -1 || genre.indexOf('焼肉') !== -1 || genre.indexOf('そば') !== -1) return 'Restaurant';
        return 'LocalBusiness';
      }
      var ldData = {
        '@context': 'https://schema.org',
        '@type': genreToSchemaType(r.genre),
        'name': r.name,
        'address': {
          '@type': 'PostalAddress',
          'streetAddress': r.address,
          'addressCountry': 'JP'
        },
        'url': pageUrl
      };
      if (r.lat && r.lng) {
        ldData.geo = { '@type': 'GeoCoordinates', 'latitude': r.lat, 'longitude': r.lng };
      }
      if (r.tel) ldData.telephone = r.tel;
      var ldScript = document.getElementById('ldJson');
      if (ldScript) ldScript.textContent = JSON.stringify(ldData);

      // Google マップ URL
      function gmapUrl() {
        return 'https://www.google.com/maps/search/?api=1&query='
             + encodeURIComponent(r.name + ' ' + r.address);
      }

      // 公開用「店舗番号」：idベース（id+1を6桁ゼロ埋め）。
      // 地名・行政コードを含まない固定書式のため、地域が増えても不変・重複なし。
      const storeNo = 'No.' + String(r.id + 1).padStart(6, '0');

      // sourceUrlのドメインから出典名を判定する。
      // 食べログ等の第三者サイトは固有名、うるま市公式サイトは名称で表示する。
      // それ以外は「公式サイト」と決めつけず、ドメイン名をそのまま出典として示す
      // （機械的にsourceUrlのドメインを見ているだけで、実際に公式か確認したわけ
      //   ではないため。誤って「公式」と断定表示しないための方針）
      const THIRD_PARTY_SITE_LABELS = [
        { domain: 'tabelog.com',    label: '食べログ' },
        { domain: 'ekiten.jp',      label: 'エキテン' },
        { domain: 'yahoo.co.jp',    label: 'Yahoo!地図' },
        { domain: 'navitime.co.jp', label: 'NAVITIME' },
        { domain: 'hotpepper.jp',   label: 'ホットペッパー' },
        { domain: 'hitosara.com',   label: 'ヒトサラ' },
        { domain: 'yelp.com',       label: 'Yelp' }
      ];
      const OFFICIAL_SITE_LABELS = [
        { domain: 'city.uruma.lg.jp', label: 'うるま市公式サイト' }
      ];
      function hostOf(url) {
        try { return new URL(url).hostname.replace(/^www\./, ''); }
        catch (e) { return ''; }
      }
      function sourceSiteLabel(url) {
        const host = hostOf(url);
        if (!host) return '';
        const findIn = function (list) {
          return list.find(function (site) { return host === site.domain || host.endsWith('.' + site.domain); });
        };
        const hit = findIn(THIRD_PARTY_SITE_LABELS) || findIn(OFFICIAL_SITE_LABELS);
        return hit ? hit.label : host;
      }
      // 「⚠️要確認」バッジの理由を短く表示する（warnReasonが未設定の場合は
      // hours/closedが「要確認」であることを理由として自動判定する）。
      const WARN_REASON_TEXT = {
        continuity: '情報源で営業継続に疑義があります',
        unverified: '店名変更など未確認の情報が残っています',
        coords: '座標の位置精度が粗い可能性があります'
      };
      function warnReasonText(r) {
        if (r.warnReason && WARN_REASON_TEXT[r.warnReason]) return WARN_REASON_TEXT[r.warnReason];
        if (r.hours === '要確認' || r.closed === '要確認') return '営業時間・定休日が出典で確認できていません';
        return '';
      }
      // 営業時間・定休日・備考の共通整形：
      // 「要確認」はwarn-textでそのまま表示（未確認であることを隠さない。出典も付けない）。
      // 確認済みの値には、必ず出典を小さく併記する。
      function fieldWithSource(value, sourceUrl) {
        const html = String(value).replace(/\n/g, '<br>');
        if (String(value).trim() === '要確認') {
          return `<span class="warn-text">⚠️ ${html}</span>`;
        }
        const label = sourceSiteLabel(sourceUrl);
        return label ? `${html}<span class="source-note"><a href="${sourceUrl}" target="_blank" rel="noopener">（情報源：${label}）</a></span>` : html;
      }

      // 営業時間整形
      const hoursHtml = fieldWithSource(r.hours, r.sourceUrl);

      // 定休日整形
      const closedHtml = fieldWithSource(r.closed, r.sourceUrl);

      // 備考整形（従来は出典表示が無かった）
      // 備考が空の場合は「情報なし」に見えないよう、Googleマップ等への案内を表示する
      const noteHtml = r.note ? fieldWithSource(r.note, r.sourceUrl) : 'Googleマップやウェブサイト、情報源をご確認ください';

      // SNS・リンクボタン（同じURLが複数フィールドに重複入力されていても
      // ボタンが2つ並ばないよう、既出のURLは後続フィールド分をスキップする）
      const links = [];
      const seenSocialUrls = new Set();
      function pushSocialLink(url, html) {
        if (!url || seenSocialUrls.has(url)) return;
        seenSocialUrls.add(url);
        links.push(html);
      }
      pushSocialLink(r.twitter,   `<a href="${r.twitter}"   class="link-btn link-x"   target="_blank" rel="noopener"><span class="icon">𝕏</span> X（Twitter）</a>`);
      pushSocialLink(r.instagram, `<a href="${r.instagram}" class="link-btn link-ig"  target="_blank" rel="noopener"><span class="icon">📸</span> Instagram</a>`);
      pushSocialLink(r.youtube,   `<a href="${r.youtube}"   class="link-btn link-yt"  target="_blank" rel="noopener"><span class="icon">▶</span> YouTube</a>`);
      // 「公式サイト」と断定表示しない（運営者本人による公開等で確認が取れていない
      // 限り、中立的な「ウェブサイト」と表示する。sourceNoteの方針と統一）
      pushSocialLink(r.website,   `<a href="${r.website}"   class="link-btn link-web" target="_blank" rel="noopener">ウェブサイト</a>`);
      // 情報源ボタン：通常は sourceUrl（単一）のみだが、複数の情報源がある店舗は
      // sourceUrls（配列）を使うと「情報源①：〇〇」「情報源②：〇〇」と番号付きで並べて表示する。
      // ただし上のSNS・リンク欄と同じURLは、ボタンが2つ並んで重複表示になるため除外する
      const socialUrls = Array.from(seenSocialUrls);
      const sourceList = (Array.isArray(r.sourceUrls) && r.sourceUrls.length > 0
        ? r.sourceUrls
        : (r.sourceUrl ? [r.sourceUrl] : [])
      ).filter(function (url) { return socialUrls.indexOf(url) === -1; });
      const CIRCLED_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];
      sourceList.forEach(function (url, i) {
        const text = sourceList.length > 1
          ? `情報源${CIRCLED_NUMS[i] || (i + 1)}：${sourceSiteLabel(url)}`
          : '情報源';
        links.push(`<a href="${url}" class="link-btn link-source" target="_blank" rel="noopener">${text}</a>`);
      });

      const linksSection = links.length > 0
        ? `<div class="section">
             <div class="section-title">リンク</div>
             <div class="link-grid">${links.join('')}</div>
           </div>`
        : '';

      // 紹介文セクション
      const textSection = `<div class="section">
        <div class="section-title">店舗紹介・詳細情報</div>
        ${r.detailText
          ? `<p class="detail-text">${r.detailText}</p>`
          : `<p class="empty-note">現在、詳細情報は準備中です。</p>`}
      </div>`;

      // 修正履歴・最終確認日
      // revisionHistory: [{date:"YYYY-MM-DD", type:"ai"|"manager"|"owner", note:"..."}]
      // データは古い順（配列末尾に追記）で保持し、表示のみ新しい順（reverse）にする
      // lastChecked と履歴の最新日付が一致する回だけ「前回より修正あり」として扱う
      const REVISION_TYPE_LABELS = { ai: 'AIによる自動修正', manager: '管理者による修正', owner: '店舗主による修正' };
      const revisionHistory = Array.isArray(r.revisionHistory) ? r.revisionHistory : [];
      const lastRevision = revisionHistory.length > 0 ? revisionHistory[revisionHistory.length - 1] : null;
      const hasChangeThisCheck = !!(lastRevision && r.lastChecked && lastRevision.date === r.lastChecked);
      const lastCheckedNote = r.lastChecked
        ? `<p class="info-note last-checked">最終情報確認または修正日：${r.lastChecked}（前回より${hasChangeThisCheck ? '修正あり。ページ下を参照。' : '修正なし'}）</p>`
        : `<p class="info-note last-checked">最終情報確認または修正日：未確認</p>`;
      const historySection = revisionHistory.length > 0
        ? `<div class="section">
             <div class="section-title">修正履歴</div>
             <ul class="revision-list">
               ${revisionHistory.slice().reverse().map(function (h) {
                 return `<li><span class="rev-date">(${h.date})</span><span class="rev-type">${REVISION_TYPE_LABELS[h.type] || h.type}</span>${h.note}</li>`;
               }).join('')}
             </ul>
           </div>`
        : '';

      // 写真セクション
      let photosSection = '';
      if (r.photos && r.photos.length > 0) {
        const imgs = r.photos.map((src, i) =>
          `<img src="${src}" alt="${r.name} 写真${i+1}" loading="lazy" onclick="openLightbox('${src}')">`
        ).join('');
        photosSection = `<div class="section">
          <div class="section-title">写真</div>
          <div class="photo-grid">${imgs}</div>
        </div>`;
      }

      // 警告ボックス
      const warnSection = r.warn
        ? `<div class="section"><div class="warn-box">⚠️ ${noteHtml}</div></div>`
        : '';

      // HTML構築
      card.innerHTML = `
        <!-- ショップヒーロー -->
        <div class="shop-hero">
          <div class="shop-name">${r.name}</div>
          <span class="shop-genre-badge">${r.genre}</span>
          ${r.warn ? `<span class="warn-badge">⚠️ 要確認</span><span class="warn-reason">${warnReasonText(r)}</span>` : ''}
        </div>

        <!-- 基本情報 -->
        <div class="section">
          <div class="section-title">基本情報</div>
          <table class="info-table">
            <tr>
              <td class="lbl">住所</td>
              <td>${r.address}</td>
            </tr>
            <tr>
              <td class="lbl">営業時間</td>
              <td>${hoursHtml}</td>
            </tr>
            <tr>
              <td class="lbl">定休日</td>
              <td>${closedHtml}</td>
            </tr>
            ${!r.warn ? `<tr><td class="lbl">備考</td><td>${noteHtml}</td></tr>` : ''}
          </table>
          ${lastCheckedNote}
          <p class="info-note">営業時間・定休日・備考は、AIが情報源をもとに自動収集したものです。詳細は情報源をご確認ください。</p>
          <p class="info-note store-no">店舗番号：${storeNo}</p>
          <p class="info-note store-no">掲載内容の修正・お問い合わせの際は、店舗番号をお知らせください。</p>
        </div>

        <!-- 警告 -->
        ${warnSection}

        <!-- Googleマップ -->
        <a href="${gmapUrl()}" target="_blank" rel="noopener" class="gmap-btn" style="margin-bottom:14px;">
          Googleマップで見る
        </a>

        <!-- リンク -->
        ${linksSection}

        <!-- 紹介文 -->
        ${textSection}

        <!-- 写真 -->
        ${photosSection}

        <!-- 修正履歴 -->
        ${historySection}
      `;
    })();

    // ライトボックス
    function openLightbox(src) {
      document.getElementById('lightboxImg').src = src;
      document.getElementById('lightbox').classList.add('open');
    }
    document.getElementById('lightboxClose').addEventListener('click', function () {
      document.getElementById('lightbox').classList.remove('open');
    });
    document.getElementById('lightbox').addEventListener('click', function (e) {
      if (e.target === this) this.classList.remove('open');
    });
  </script>
</body>
</html>
