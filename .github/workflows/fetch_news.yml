name: 今日の石川ニュース 自動更新

on:
  schedule:
    # 毎日 21:00 UTC = 翌朝 6:00 JST
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行ボタンも有効化

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存ライブラリをインストール
        run: pip install feedparser requests

      - name: ニュース収集スクリプトを実行
        run: python scripts/fetch_news.py

      - name: 変更をコミット・プッシュ
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add news/
          git diff --staged --quiet || git commit -m "🗞️ 今日の石川ニュース自動更新 $(TZ='Asia/Tokyo' date +'%Y-%m-%d')"
          git push
