name: Update Visitor Count

on:
  schedule:
    - cron: '0 * * * *'   # 毎時0分（UTC）= 毎時9分（JST）に実行
  workflow_dispatch:        # GitHub画面から手動実行も可能

permissions:
  contents: write           # gh-dataブランチへのプッシュ権限

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-data branch
        uses: actions/checkout@v4
        with:
          ref: gh-data
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install GA4 API dependencies
        continue-on-error: true   # GA4側の不具合でGoatCounter更新を止めないため
        run: pip install --quiet google-auth requests

      - name: Fetch GA4 today's session count and update ga4-today.json
        continue-on-error: true   # 同上
        env:
          GA4_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          python3 << 'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone, timedelta
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          import requests

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          today_str = now.strftime('%Y-%m-%d')

          # GA4プロパティID（石川マップ、ishikawamap2026アカウント配下）
          PROPERTY_ID = '549916210'

          try:
              creds_info = json.loads(os.environ['GA4_KEY'])
              creds = service_account.Credentials.from_service_account_info(
                  creds_info, scopes=['https://www.googleapis.com/auth/analytics.readonly'])
              creds.refresh(Request())

              r = requests.post(
                  f'https://analyticsdata.googleapis.com/v1beta/properties/{PROPERTY_ID}:runReport',
                  headers={'Authorization': f'Bearer {creds.token}', 'Content-Type': 'application/json'},
                  json={
                      'dateRanges': [{'startDate': 'today', 'endDate': 'today'}],
                      # sessions = 訪問回数（同じ人の再訪も別カウント）。
                      # ユニーク訪問者数を出したい場合は activeUsers に戻す。
                      'metrics': [{'name': 'sessions'}]
                  },
                  timeout=15
              )
              r.raise_for_status()
              rows = r.json().get('rows', [])
              count = int(rows[0]['metricValues'][0]['value']) if rows else 0
              print(f'GA4 today session count: {count}')
          except Exception as e:
              print(f'Failed to fetch GA4 count: {e}')
              sys.exit(0)   # 失敗時はコミットしない（既存ファイルを維持）

          with open('ga4-today.json', 'w') as f:
              json.dump({'date': today_str, 'count': count, 'ts': now.isoformat()}, f, ensure_ascii=False)

          print(f'Saved ga4-today.json: {count} at {now.isoformat()}')
          PYEOF

      - name: Fetch GoatCounter count and update visitor-log.json
        run: |
          python3 << 'PYEOF'
          import json, urllib.request, sys
          from datetime import datetime, timezone, timedelta

          JST = timezone(timedelta(hours=9))
          now = datetime.now(JST)
          cutoff = now - timedelta(hours=49)   # 49時間以内だけ保持

          # GoatCounter 公開カウンターAPIから累計取得
          # ※2026-08-09頃からAPIが件数を「1 056」のように桁区切り
          #   （U+202F等の空白文字）付き文字列で返すようになり、int()が
          #   失敗して以降ログが更新されなくなっていた。区切り文字を
          #   除去してから数値化する。
          try:
              url = 'https://ishikawamap.goatcounter.com/counter//ishikawa-map/.json'
              with urllib.request.urlopen(url, timeout=15) as resp:
                  response = json.loads(resp.read())
              # アクセス数（総訪問回数）を表示するため count を優先する
              raw = str(response.get('count') or response.get('count_unique') or 0)
              digits = ''.join(ch for ch in raw if ch.isdigit())
              count = int(digits) if digits else 0
              print(f'Fetched count: {count} (raw: {raw!r})')
          except Exception as e:
              print(f'Failed to fetch count: {e}')
              sys.exit(0)   # 失敗時はコミットしない

          # 既存ログ読み込み
          try:
              with open('visitor-log.json', 'r') as f:
                  data = json.load(f)
          except Exception:
              data = []

          # 49時間以内のデータだけ保持（今日＋昨日分を確保）
          data = [d for d in data if datetime.fromisoformat(d['ts']) > cutoff]

          # 新エントリ追加
          data.append({"ts": now.isoformat(), "count": count})

          with open('visitor-log.json', 'w') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(f'Saved {len(data)} entries. Latest: {count} at {now.isoformat()}')
          PYEOF

      - name: Commit and push to gh-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add visitor-log.json ga4-today.json
          if ! git diff --staged --quiet; then
            git commit -m "🤖 visitor-log $(TZ='Asia/Tokyo' date '+%Y-%m-%d %H:%M') JST"
            git push origin gh-data
          else
            echo "No changes to commit"
          fi
