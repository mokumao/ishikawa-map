name: Deploy to GitHub Pages (Actions)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # ニュース収集内のGITHUB_TOKENによるpushは別Workflowを起動しないため、
  # 収集Workflowの正常終了を直接受けて最新mainを再公開する。
  workflow_run:
    workflows: ["今日の石川ニュース 自動更新"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # ニュース収集が失敗した場合は、古い内容を再公開せず終了する。
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # /admin は管理者専用ページ（Cloudflare Pages + Cloudflare Access で別途保護）。
      # GitHub Pages（石川マップ本体・認証なしの公開サイト）には絶対に含めない。
      - name: Exclude admin page from public deployment
        run: rm -rf admin

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # デフォルトは10分でタイムアウトし強制キャンセルされる。
          # このサイトはデプロイが完了までに時間がかかる状態が続いているため、
          # 早すぎる打ち切りを避けて30分まで待つように延長する（2026-08-07）
          timeout: 1800000
